# ===================================================================
# 1. DATABASE & FLYWAY CONFIGURATION
# ===================================================================
# Force Flyway to manage the schema; prevents Hibernate auto-generation conflicts
spring.jpa.hibernate.ddl-auto=none

# Disables default JDBC script initializers (schema.sql / data.sql)
spring.sql.init.mode=never

# Required to allow flyway.clean() invocation between test runs
spring.flyway.clean-disabled=false

spring.datasource.url=jdbc:postgresql://localhost:5432/it_placeholder
spring.datasource.username=it_placeholder
spring.datasource.password=it_placeholder

spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=redis_password

# ===================================================================
# 2. EXTERNAL SERVICES MOCKS & STUBS
# ===================================================================
# Mock GreenMail or local test SMTP server configurations
spring.mail.host=localhost
spring.mail.port=3025
spring.mail.username=test
spring.mail.password=test


# ===================================================================
# 3. SECURITY & APPLICATION SETTINGS
# ===================================================================
# Safe, hardcoded 256-bit signature key to bypass HMAC security exceptions
jwt.secretKey=test-secret-key-for-integration-testing-only-minimum-256-bits-long

# Test execution baseline URL
app.base.url=http://localhost:8080
app.mail.from=test@example.com


# ===================================================================
# 4. LOGGING & DIAGNOSTICS CONTROL
# ===================================================================
# Suppresses context startup verbosity
logging.level.org.springframework=WARN

# Keeps container orchestration framework logs readable
logging.level.org.testcontainers=INFO

# Turns off heavy SQL logging during batch test runs
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.show_sql=false


# ===================================================================
# 5. FREEMARKER CONFIGURATION
# ===================================================================
spring.freemarker.template-loader-path=classpath:/templates/
spring.freemarker.suffix=.ftl
spring.freemarker.content-type=text/html
